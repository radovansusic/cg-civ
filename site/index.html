<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CG Civ - Crna Gora na heksovima</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: strateška igra koja govori kao statistički godišnjak - mirno, tačno, sa izvorom ispod svake brojke.
   IDEA: atlas-ploča iz Civilizacije: more i heksovi, gradski barjaci, savjetnici.
   PICTURE: cijela Crna Gora na 1.850 heksova od ~8 km2, obojena izabranim sočivom.
   COLOUR and TYPE: duboko more #0b2233, bordo Schule #630D3D, zlato #d9a441 za akcenat; Caladea naslovi, Carlito tekst.
   LAYOUT: mapa lijevo preko cijele visine, ploča sa karticama desno; ispod 900px ploča ide ispod mape. */
:root{color-scheme:dark;--sea:#0a1c2c;--bg:#0c1620;--panel:#121f2b;--panel2:#18293a;--ink:#ece5d3;
--mute:#9eabb5;--line:#2a3d4f;--bordo:#630D3D;--bordo2:#c2577f;--gold:#d9a441;--gold2:#b8913f}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Carlito,Calibri,'Segoe UI',sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Caladea,Cambria,Georgia,serif;margin:0;line-height:1.1;text-wrap:balance}
button,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px;background:linear-gradient(#1c2c3b,#0f1a24);color:#ece5d3;border-bottom:2px solid var(--gold2);box-shadow:0 2px 10px rgba(0,0,0,.5);position:relative;z-index:2}
.emb{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a1a55,#4a0a2d);border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);font:700 17px Caladea,serif}
.ttl{display:flex;align-items:center;gap:10px}
header h1{font-size:24px;font-variant:small-caps;letter-spacing:.08em;color:#f3ead2}header .sub{font-size:13px;color:#a9b4bc}
header .sub a{color:var(--gold)}
.srch{margin-inline-start:auto}.srch input{width:260px;max-width:60vw;min-height:36px;border-radius:18px;border:1px solid #3a4f62;background:#0d1822;color:#ece5d3;padding:6px 14px;font-size:14px}
.srch input:focus{outline:2px solid var(--gold);outline-offset:1px}
.pills{display:flex;flex-wrap:wrap;gap:4px 14px}
.pill{font-size:14px;white-space:nowrap;color:#cfd6db;display:flex;align-items:center;gap:6px}
.pill i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.pill b{font-variant-numeric:tabular-nums;color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 56px);min-height:520px}
#mapwrap{position:relative;background:var(--sea);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#legend{position:absolute;left:12px;top:12px;background:rgba(12,22,32,.9);color:#e9e4d8;border:1px solid var(--gold2);border-radius:8px;padding:9px 12px;font-size:13px;max-width:min(300px,60%);box-shadow:0 4px 14px rgba(0,0,0,.45)}
#legend b{font-family:Caladea,serif;font-size:15px;color:#f3ead2}
#myth{position:absolute;left:0;top:0;width:160px;height:160px;transform:translate(-50%,-50%);pointer-events:none;opacity:0;animation:mythIn 2.6s ease-out 1.1s forwards;z-index:1}
#myth .halo,#myth .rays,#myth .core{position:absolute;inset:0;border-radius:50%}
#myth .halo{background:radial-gradient(circle,rgba(255,236,170,.32) 0,rgba(255,206,110,.14) 22%,rgba(255,190,90,.04) 45%,rgba(255,190,90,0) 62%);animation:mythPulse 4.5s ease-in-out infinite;mix-blend-mode:screen}
#myth .rays{background:repeating-conic-gradient(from 0deg,rgba(255,226,150,.07) 0 5deg,rgba(255,226,150,0) 5deg 22deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);animation:mythSpin 40s linear infinite;mix-blend-mode:screen}
#myth .core{pointer-events:auto;cursor:pointer;inset:46%;background:radial-gradient(circle,#fff4d0,#e9bd5a 60%,rgba(255,200,90,0));box-shadow:0 0 8px 2px rgba(255,214,120,.35)}
#myth .mlab{position:absolute;left:50%;top:70%;transform:translateX(-50%);pointer-events:auto;cursor:pointer;border:1px solid rgba(255,214,140,.8);background:linear-gradient(rgba(60,30,10,.85),rgba(30,15,5,.9));color:#ffe8b0;border-radius:14px;padding:3px 12px 4px;font:700 15px Caladea,serif;font-variant:small-caps;letter-spacing:.14em;white-space:nowrap;text-shadow:0 0 4px rgba(255,200,100,.4);box-shadow:0 0 6px rgba(255,200,100,.2)}
#myth .mlab small{display:block;font:italic 400 11px Caladea,serif;letter-spacing:.04em;color:#f3dca4;text-shadow:none}
@keyframes mythIn{0%{opacity:0;filter:blur(8px);transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes mythPulse{0%,100%{transform:scale(.95);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes mythSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#myth{animation:none;opacity:1}#myth .halo,#myth .rays{animation:none}}
#mini{position:absolute;left:12px;bottom:12px;width:190px;height:160px;border:2px solid var(--gold2);border-radius:6px;background:#0a1622;box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer}
#lensbar{position:absolute;right:12px;bottom:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:calc(100% - 230px);padding:5px;background:rgba(12,22,32,.85);border:1px solid var(--gold2);border-radius:8px}
#lensbar button{border:1px solid #3a4f62;background:linear-gradient(#22364a,#172636);color:#e6dfcd;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;min-height:36px}
#lensbar button[aria-pressed=true]{background:linear-gradient(#7a5a1e,#5a3f12);border-color:var(--gold);color:#fff}
#lensbar #holyT{border-color:#b8862a}#lensbar #holyT[aria-pressed=true]{background:linear-gradient(#efe2bd,#cdb47a);color:#2a1c08}
#legend .bar{height:10px;border-radius:5px;margin:6px 0 2px}
#legend .ends{display:flex;justify-content:space-between;gap:10px}
#tip{position:absolute;pointer-events:none;background:#15222e;color:#ece5d3;border:1px solid var(--gold2);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;max-width:260px;z-index:3}
#tip b{font-family:Caladea,serif;font-size:15px;color:#f3ead2}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold2);background:radial-gradient(circle at 40% 35%,#26394c,#111d28);color:#f3ead2;font-size:20px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5)}
aside{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;min-height:44px;border:0;background:none;padding:8px 10px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{border-bottom-color:var(--gold);font-weight:700;color:#f3ead2}
.tabs{background:linear-gradient(#1a2a39,#132130)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pane{padding:14px 16px;overflow-y:auto;flex:1}
.pane[hidden]{display:none}
.lgrp{font-size:13px;color:var(--mute);margin:14px 0 6px}
.lens{display:block;width:100%;text-align:start;border:1px solid var(--line);background:none;border-radius:8px;padding:8px 10px;margin:4px 0;cursor:pointer;min-height:40px}
.lens[aria-pressed=true]{border-color:var(--gold);background:#2b2414}
.lgrp{font-family:Caladea,serif;font-variant:small-caps;letter-spacing:.05em;color:var(--gold)!important;font-size:15px!important}
.lens small{display:block;color:var(--mute);font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px;background:linear-gradient(var(--panel2),var(--panel))}
.card h3{font-size:19px;margin-bottom:4px;color:#f3ead2;font-variant:small-caps;letter-spacing:.03em}
.card .find{margin:4px 0 8px}
.card ol{margin:0;padding-inline-start:20px;font-size:15px}
.card .go{border:1px solid var(--gold2);background:linear-gradient(#7a5a1e,#5a3f12);color:#fff;border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer;margin-top:8px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}
label.sel{display:block;font-size:13px;color:var(--mute);margin:6px 0 2px}
select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 8px;font-size:16px}
.fig{position:relative;height:300px;margin:10px 0}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
th:first-child,td:first-child{text-align:start;position:sticky;left:0;background:var(--panel)}
th{cursor:pointer;font-weight:700;font-size:13px;vertical-align:bottom}
tr.hl td{background:#2b2414}
tbody tr{cursor:pointer}
#city{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);display:none;z-index:10}
#city.open{display:flex}
#city .box{background:var(--panel);color:var(--ink);border-left:2px solid var(--gold2);width:100%;height:100%;overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.55)}
#city .top{background:linear-gradient(120deg,#6e1446,#2a0a1e 70%,#141f2a);border-bottom:2px solid var(--gold2);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
#city .top h2{font-size:36px;font-variant:small-caps;letter-spacing:.05em;color:#f6ecd2}
.medals{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.med{width:62px;text-align:center;font-size:11px;color:#e8dcc0}
.med b{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 2px;border-radius:50%;font:700 14px Caladea,serif;color:#2a1c08;border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.m1 b{background:radial-gradient(circle at 35% 30%,#fff1b8,#c99a2e)}.m2 b{background:radial-gradient(circle at 35% 30%,#ffffff,#a9b0b8)}.m3 b{background:radial-gradient(circle at 35% 30%,#f3c9a0,#a8673a)}
#city .x{margin-inline-start:auto;width:44px;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
#city .body{padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.yields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.y{border-radius:10px;padding:8px;color:#fff}
.y b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.y span{font-size:13px}
.dist{display:flex;flex-wrap:wrap;gap:6px}
.dist span{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px}
.dist span i{display:block;font-style:normal;color:var(--mute);font-size:13px}
.kv td{text-align:end}.kv td:first-child{text-align:start;white-space:normal}
.popbars{display:flex;gap:8px;align-items:flex-end;height:80px}
.popbars div{flex:1;background:var(--bordo2);border-radius:4px 4px 0 0;position:relative}
.popbars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px}
.popbars+div{display:flex;gap:8px}.popbars+div span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);height:auto}#mapwrap{height:72vh}aside{border-inline-start:0}.pills{margin-inline-start:0}#mini{width:120px;height:100px}#lensbar{max-width:calc(100% - 150px)}#lensbar button{padding:4px 7px;font-size:13px}}
@media(max-width:600px){#city .body{grid-template-columns:minmax(0,1fr)}header h1{font-size:20px}#city .top h2{font-size:28px}
header{padding:6px 10px;gap:4px 10px}header .sub{font-size:12px}.emb{width:28px;height:28px;font-size:14px}.pills{gap:2px 10px}.pill{font-size:12px}
.srch{order:3;width:100%}.srch input{width:100%;max-width:none}#legend{font-size:11px;padding:6px 8px;max-width:52%;line-height:1.35;max-height:96px;overflow:auto}#legend b{font-size:13px}#mini{display:none}
#lensbar{left:8px;right:8px;bottom:8px;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}#lensbar button{flex:none}
.zoom{right:8px;top:8px}.zoom button{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="ttl"><div class="emb" aria-hidden="true">★</div><div><h1>Crna Gora</h1><div class="sub">CG Civ: 25 opština, 1.850 heksova, stvarni podaci · <a href="https://schule.co.me">schule.co.me</a></div></div></div>
  <div class="srch"><input id="q" list="ql" placeholder="Traži opštinu, čudo ili sveto mjesto" aria-label="Pretraga"><datalist id="ql"></datalist></div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map" aria-label="Heks mapa Crne Gore"></canvas>
    <div class="zoom"><button id="zin" aria-label="Uvećaj">+</button><button id="zout" aria-label="Umanji">-</button><button id="zfit" aria-label="Cijela mapa">◎</button></div>
    <div id="legend"></div><div id="tip"></div>
    <canvas id="mini" aria-label="Pregledna mapa, klik pomjera pogled"></canvas>
    <div id="lensbar" aria-label="Brza sočiva"></div>
    <div id="myth" aria-hidden="false"><div class="rays"></div><div class="halo"></div><div class="core"></div><button class="mlab" type="button">Lovćen<small>Njegoševa kapela</small></button></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-t="lenses" aria-selected="true">Sočiva</button>
      <button role="tab" data-t="advisors" aria-selected="false">Savjetnici</button>
      <button role="tab" data-t="explorer" aria-selected="false">Istraživač</button>
      <button role="tab" data-t="sources" aria-selected="false">Izvori</button>
    </div>
    <div class="pane" id="p-lenses"><p class="muted">Klik na grad otvara pogled grada. Klik na heks pokazuje njegove brojke. Prevuci i zumiraj.</p><div id="lensList"></div><div id="hexInfo"></div></div>
    <div class="pane" id="p-advisors" hidden></div>
    <div class="pane" id="p-explorer" hidden>
      <label class="sel" for="ex">Osa X</label><select id="ex"></select>
      <label class="sel" for="ey">Osa Y</label><select id="ey"></select>
      <div class="fig"><svg id="scatter" role="img" aria-label="Dijagram rasipanja opština"></svg></div>
      <p class="muted" id="corr"></p>
      <div class="scroll"><table id="extab"></table></div>
    </div>
    <div class="pane" id="p-sources" hidden></div>
  </aside>
</main>
<div id="city" role="dialog" aria-modal="true" aria-labelledby="cityName"><div class="box" id="cityBox"></div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>v==null||isNaN(v)?'-':Number(v).toLocaleString('sr-Latn-ME',{maximumFractionDigits:d,minimumFractionDigits:0});
const SQ3=Math.sqrt(3);
const TERR={plains:['#c8bf78','Ravnica'],grassland:['#93b35e','Livade i polja'],hills:['#6e8c4b','Brda'],mountain:['#8b8272','Planine'],peak:['#ece9e2','Vrhovi iznad 2.100 m'],lake:['#3d7ea8','Jezero'],sea:['#1c4f74','More']};
const YC={food:'#4f9a3c',prod:'#c8692a',gold:'#c9952c',science:'#3f7fc9',culture:'#8a4bb0',faith:'#e0d7c3'};
let touched=false,D,V,hexes,byKey={},cityByKey={},T={},nat,s=10,tx=0,ty=0,lens='terrain',sel=null,dpr=1;
const cv=$('#map');let cx=cv.getContext('2d');const CX0=cx;

let COAST=null;{const im=new Image();im.onload=()=>{COAST=im;SC=null;draw()};im.src='obala.png'}
Promise.all(['cgciv.json','cgviz.json'].map(u=>fetch(u).then(r=>r.json()))).then(([d,v])=>{D=d;V=v;init()}).catch(e=>{console.error(e.stack);$('#legend').textContent='Podaci nijesu učitani: '+e.message});

function init(){
  hexes=D.hexes;nat=D.meta.nat;
  for(const h of hexes){h.px=SQ3*(h.q+h.r/2);h.py=-1.5*h.r;byKey[h.q+','+h.r]=h}
  for(const c of D.cities)cityByKey[c.q+','+c.r]=c;
  for(const r of D.table)T[r['Opština']]=r;
  $('#pills').innerHTML=[['Stanovnici',fmt(nat.pop2023),'#e9e4d8'],['Zlato',fmt(nat.wagebill_meur)+' mil. €',YC.gold],['Proizvodnja: firme',fmt(nat.firms2025),YC.prod],['Nauka: fakultet',fmt(nat.higher_share*100,1)+'%',YC.science],['Kultura: noćenja',fmt(nat.nights2025/1e6,1)+' mil.',YC.culture]]
    .map(([a,b,c])=>`<span class="pill" title="${a}"><i style="background:${c}"></i>${a.split(':')[0]} <b>${b}</b></span>`).join('');
  prepWorld();lensbar();buildLenses();buildSearch();buildAdvisors();buildExplorer();buildSources();resize();fit();
}

/* ---------- lenses ---------- */
const HL={
  terrain:{g:'Mapa',l:'Teren',d:'Pokrivač tla ESA WorldCover 2021 (šume, livade, makija, polja, naselja) i reljef: brda, planine, snijeg.'},
  elev:{g:'Mapa',l:'Reljef',d:'Prosječna nadmorska visina heksa, m',v:h=>h.terrain==='sea'?null:h.emean,ramp:['#2f6b3a','#d8c48a','#8b5a3c','#f2f0ea']},
  pop:{g:'Prinosi heksa',l:'Stanovnici',d:'Popis 2023 raspoređen po Kontur mreži naseljenosti',v:h=>h.pop,log:1},
  gold:{g:'Prinosi heksa',l:'Zlato',d:'1 zlato = 1 mil. € godišnje mase neto zarada (zaposleni x plata x 12), raspoređeno po stanovnicima',v:h=>h.gold,log:1,ramp:['#3a2f12','#c9952c','#ffe7a3']},
  prod:{g:'Prinosi heksa',l:'Proizvodnja',d:'Teren + aktivne firme 2025 (1 po 60) + elektrane (1 po 20 MW)',v:h=>h.prod,ramp:['#2a1a10','#c8692a','#ffd2a8']},
  science:{g:'Prinosi heksa',l:'Nauka',d:'Stanovnici sa fakultetom (Popis 2023), 1 po 300',v:h=>h.science,log:1,ramp:['#0f2238','#3f7fc9','#cfe4ff']},
  culture:{g:'Prinosi heksa',l:'Kultura i turizam',d:'Objekti baštine u OSM + noćenja 2025 (1 po 25.000)',v:h=>h.culture,log:1,ramp:['#1f1029','#8a4bb0','#ecd3ff']},
  faith:{g:'Prinosi heksa',l:'Vjera',d:'Broj bogomolja u OpenStreetMap, bez podjele po vjeri',v:h=>h.faith,log:1,ramp:['#2a2620','#bfb39a','#fffaf0']},
  food:{g:'Prinosi heksa',l:'Hrana',d:'Po terenu, +1 uz more i uz jezero (pravilo igre, ne podatak o proizvodnji)',v:h=>h.food,ramp:['#1f2a14','#4f9a3c','#d6f5b8']},
  nights:{g:'Prinosi heksa',l:'Noćenja',d:'Noćenja 2025 opštine raspoređena po smještajnim objektima iz OSM',v:h=>h.nights,log:1,ramp:['#10202c','#2e9aa8','#c9fbff']},
};
const WEALTH_LENS=['Indeks bogatstva','Masa zarada po st. €','Neto plata 01-09.2026 €','Rast plate 2026/2025 %','Rast hotela avg-sep 2026 %'];
const POPIS_LENS=['Crnogorci %','Srbi %','Bošnjaci %','Albanci %','Muslimani %','Hrvati %','Rusi %','Ukrajinci %','Govori srpski %','Govori crnogorski %','Govori bosanski %','Govori albanski %','Pravoslavni %','Islam %','Katolici %','Ateisti %'];
const CATS={'cat:_nacija':{l:'Najbrojnija nacija',c:{Crnogorci:'#c98b6f',Srbi:'#6f8fbf',Bošnjaci:'#6fae8a',Albanci:'#d9b24a'}},'cat:_jezik':{l:'Najčešći jezik u govoru',c:{Crnogorski:'#c98b6f',Srpski:'#6f8fbf',Bosanski:'#6fae8a',Albanski:'#d9b24a'}}};

   ['Savjetnik za privredu','m:Firme na 1.000 st.',`Aktivnih firmi ima ${fmt(nat.firms2025)}, ${fmt(fg,1)}% više nego 2024. Budva ima ${fmt(T['Budva']['Firme na 1.000 st.'])} firmi na 1.000 stanovnika, CG ${fmt(nat.firms2025/nat.pop2023*1000)}.`,'Najbrži rast broja firmi 2024-25',li(top('Rast firmi 2024-25 %'),'Rast firmi 2024-25 %','%')],
   ['Naučni savjetnik','m:Fakultet % (15+)',`Fakultet ima ${fmt(he,1)}% stanovnika 15+. Raspon među opštinama je od ${fmt(top('Fakultet % (15+)',1,false)[0]['Fakultet % (15+)'],1)}% do ${fmt(top('Fakultet % (15+)',1)[0]['Fakultet % (15+)'],1)}%.`,'Najveći udio sa fakultetom',li(top('Fakultet % (15+)'),'Fakultet % (15+)','%')],
   ['Savjetnik za turizam','m:Noćenja po stanovniku',`Šest primorskih opština ostvarilo je ${fmt(nightsCoast/nat.nights2025*100,1)}% od ${fmt(nat.nights2025)} noćenja 2025 (ukupan smještaj). Hoteli su u avgustu i septembru 2026. imali 6-10% više noćenja nego godinu ranije. Petnjica nema objavljen podatak.`,'Najviše noćenja po stanovniku',li(top('Noćenja po stanovniku'),'Noćenja po stanovniku','',0)],
   ['Savjetnik za prostor','m:Sezonski stanovi %',`Od ${fmt(nat.dwellings)} stanova, ${fmt(nat.dwellings_seasonal)} (${fmt(nat.dwellings_seasonal/nat.dwellings*100,1)}%) služi za sezonsko korišćenje (Popis 2023).`,'Najveći udio sezonskih stanova',li(top('Sezonski stanovi %'),'Sezonski stanovi %','%')],
   ['Demografski savjetnik','m:Promjena 1991-2023 %',`Od 1991. do 2023. najviše je izgubio ${esc(top('Promjena 1991-2023 %',1,false)[0]['Opština'])} (${fmt(top('Promjena 1991-2023 %',1,false)[0]['Promjena 1991-2023 %'],1)}%), najviše dobila ${esc(top('Promjena 1991-2023 %',1)[0]['Opština'])} (+${fmt(top('Promjena 1991-2023 %',1)[0]['Promjena 1991-2023 %'],1)}%). Opštine nastale poslije 2011. nemaju poređenje.`,'Najveći pad stanovništva od 1991.',li(top('Promjena 1991-2023 %',3,false),'Promjena 1991-2023 %','%')],
   ['Savjetnik za rad','m:Nezaposlenost % (reg.)',`Trinaest sjevernih opština ima ${fmt(nU/nat.unemployed_jun2026*100)}% registrovanih nezaposlenih, a ${fmt(nE/nat.employed2024*100)}% zaposlenih CG.`,'Najveća registrovana nezaposlenost',li(top('Nezaposlenost % (reg.)'),'Nezaposlenost % (reg.)','%')],
   ['Socijalni savjetnik','m:MOP korisnici na 1.000 st.',`Materijalno obezbjeđenje porodice (MOP) je najzastupljenije tamo gdje je nezaposlenost najveća. Ljekara na 10.000 stanovnika najviše ima ${esc(top('Ljekari na 10.000 st.',1)[0]['Opština'])}.`,'Najviše korisnika MOP na 1.000',li(top('MOP korisnici na 1.000 st.'),'MOP korisnici na 1.000 st.','')],
   ['Savjetnik za bogatstvo','m:Indeks bogatstva',`Indeks bogatstva je CG Civ procjena, ne BDP: spaja masu zarada po stanovniku, firme na 1.000, sezonske stanove i fakultet. Plate januar-septembar 2026 najviše su porasle u ${esc(top('Rast plate 2026/2025 %',1)[0]['Opština'])} (+${fmt(top('Rast plate 2026/2025 %',1)[0]['Rast plate 2026/2025 %'],1)}%), a pale u ${esc(top('Rast plate 2026/2025 %',1,false)[0]['Opština'])} (${fmt(top('Rast plate 2026/2025 %',1,false)[0]['Rast plate 2026/2025 %'],1)}%).`,'Najveći indeks bogatstva',li(top('Indeks bogatstva'),'Indeks bogatstva','',2)],
   ['Savjetnik za narode i jezike','cat:_nacija',`Prema Popisu 2023, najbrojnija grupa u opštini su Crnogorci u ${D.table.filter(r=>r._nacija==='Crnogorci').length}, Srbi u ${D.table.filter(r=>r._nacija==='Srbi').length}, Bošnjaci u ${D.table.filter(r=>r._nacija==='Bošnjaci').length} i Albanci u ${D.table.filter(r=>r._nacija==='Albanci').length} opština. Srpski je najčešći jezik u govoru u ${D.table.filter(r=>r._jezik==='Srpski').length} od 25 opština.`,'Najveći udio Rusa (Popis 2023)',li(top('Rusi %'),'Rusi %','%')],
   ['Savjetnik za vjeru i baštinu','faith',(()=>{const H=V.holy,c=k=>H.filter(h=>h.k===k).length,t=k=>H.filter(h=>h.k===k)[0];
     return `Na mapi je ${H.length} vjerskih i memorijalnih objekata iz Wikidata: ${c('orthodox')} pravoslavnih, ${c('catholic')} katoličkih, ${c('islam')} džamija i Njegošev mauzolej na Lovćenu. Najpoznatiji po vjeri, mjereno brojem jezika na Wikipediji: ${esc(t('orthodox').n)} (${t('orthodox').sl}), ${esc(t('catholic').n)} (${t('catholic').sl}), ${esc(t('islam').n)} (${t('islam').sl}). Zlatne značke su sveta čuda: Ostrog, Cetinjski manastir, mauzolej na mjestu Njegoševe kapele i najpoznatiji hram svake vjere.`})(),
     'Najpoznatija sveta mjesta','<ol>'+[...V.holy].sort((a,b)=>b.sl-a.sl).slice(0,6).map(h=>`<li>${esc(h.n)} <span class="num">${h.sl}</span> <span class="muted">${esc(h.m)}</span></li>`).join('')+'</ol>'],
   ['Investicioni signali (Schule)','m:Rast firmi 2024-25 %',`Pravilo 1: broj firmi raste brže od CG (${fmt(fg,1)}%), a plata je ispod CG (${nat.net_wage2025} €). Pravilo 2: turizam iznad 20 noćenja po stanovniku, a fakultet ispod CG: ${sig2.map(r=>esc(r['Opština'])).join(', ')||'nema'}. Ovo su signali iz podataka, ne preporuka.`,'Pravilo 1 ispunjavaju',li(sig1,'Rast firmi 2024-25 %','%')],
  ];
  $('#p-advisors').innerHTML=A.map(([t,l,f,h,list])=>`<div class="card"><h3>${t}</h3><p class="find">${f}</p><div class="muted">${h}</div>${list}<button class="go" data-l="${esc(l)}">Prikaži na mapi</button></div>`).join('');
  $('#p-advisors').addEventListener('click',e=>{const b=e.target.closest('.go');if(b){setLens(b.dataset.l);showTab('lenses')}});
}

/* ---------- explorer ---------- */
let sortC='Stanovnici 2023',sortD=true;
function buildExplorer(){
  const cols=Object.keys(D.table[0]).filter(c=>c!=='Opština'&&!c.startsWith('_'));
  const opt=v=>cols.map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('');
  $('#ex').innerHTML=opt('Fakultet % (15+)');$('#ey').innerHTML=opt('Neto plata 2025 €');
  $('#ex').onchange=$('#ey').onchange=scatter;new ResizeObserver(scatter).observe($('#scatter'));table();
}
function scatter(){
  const sv=$('#scatter'),W=sv.clientWidth,H=sv.clientHeight;if(!W)return;const X=$('#ex').value,Y=$('#ey').value;
  const pts=D.table.filter(r=>r[X]!=null&&r[Y]!=null);const xs=pts.map(r=>r[X]),ys=pts.map(r=>r[Y]);
  const pad={l:44,r:W>420?70:16,t:10,b:30},x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sx=v=>pad.l+(v-x0)/((x1-x0)||1)*(W-pad.l-pad.r),sy=v=>H-pad.b-(v-y0)/((y1-y0)||1)*(H-pad.t-pad.b);
  const n=pts.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0,syy=0;pts.forEach(r=>{sxy+=(r[X]-mx)*(r[Y]-my);sxx+=(r[X]-mx)**2;syy+=(r[Y]-my)**2});
  const rr=sxy/Math.sqrt(sxx*syy);$('#corr').textContent=`Korelacija r = ${fmt(rr,2)} na ${n} opština. Veličina tačke = broj stanovnika.`;
  const ink=getComputedStyle(document.body).color;
  sv.innerHTML=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="${ink}" opacity=".3"/><line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="${ink}" opacity=".3"/>
  <text x="${W-pad.r}" y="${H-6}" text-anchor="end" font-size="12" fill="${ink}">${esc(X)}</text><text x="${pad.l+4}" y="${pad.t+10}" font-size="12" fill="${ink}">${esc(Y)}</text>
  <text x="${pad.l-4}" y="${H-pad.b}" text-anchor="end" font-size="11" fill="${ink}" opacity=".7">${fmt(y0,0)}</text><text x="${pad.l-4}" y="${pad.t+22}" text-anchor="end" font-size="11" fill="${ink}" opacity=".7">${fmt(y1,0)}</text>`+
  pts.map(r=>{const m=r['Opština'],x=sx(r[X]),y=sy(r[Y]),rad=3+Math.sqrt(r['Stanovnici 2023'])/40;
   return`<g data-m="${esc(m)}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${rad}" fill="${m===sel?'#d9a441':'#630D3D'}" fill-opacity=".8" stroke="#fff"/>${W>420||rad>6?`<text x="${x+rad+2}" y="${y+4}" font-size="11" fill="${ink}">${esc(m)}</text>`:''}</g>`}).join('');
  sv.onclick=e=>{const g=e.target.closest('g[data-m]');if(g)focusMuni(g.dataset.m)};
}
function table(){
  const cols=Object.keys(D.table[0]).filter(c=>!c.startsWith('_'));const rows=[...D.table].sort((a,b)=>sortC==='Opština'?a[sortC].localeCompare(b[sortC])*(sortD?-1:1):((b[sortC]??-1e9)-(a[sortC]??-1e9))*(sortD?1:-1));
  $('#extab').innerHTML=`<thead><tr>${cols.map(c=>`<th data-c="${esc(c)}">${esc(c)}${c===sortC?(sortD?' ↓':' ↑'):''}</th>`).join('')}</tr></thead><tbody>`+
   rows.map(r=>`<tr data-m="${esc(r['Opština'])}" class="${r['Opština']===sel?'hl':''}">${cols.map(c=>`<td class="${c==='Opština'?'':'num'}">${c==='Opština'?esc(r[c]):fmt(r[c],1)}</td>`).join('')}</tr>`).join('')+'</tbody>';
}
$('#extab').addEventListener('click',e=>{const th=e.target.closest('th');if(th){const c=th.dataset.c;sortD=c===sortC?!sortD:true;sortC=c;table();return}const tr=e.target.closest('tr[data-m]');if(tr)focusMuni(tr.dataset.m)});
function focusMuni(m){sel=m;const c=D.cities.find(x=>x.name===m),r=cv.getBoundingClientRect();s=Math.max(s,9);tx=r.width/2-SQ3*(c.q+c.r/2)*s;ty=r.height/2+1.5*c.r*s;draw();table();scatter()}

/* ---------- sources ---------- */
function buildSources(){
  const S=Object.entries(D.sources).reduce((m,[k,v])=>{(m[v]=m[v]||[]).push(k);return m},{});
  $('#p-sources').innerHTML=`<h3 style="font-size:20px">Kako je mapa napravljena</h3>
  <p>Crna Gora je podijeljena na ${fmt(hexes.length)} heksova od oko 8 km² (${fmt(hexes.filter(h=>h.muni).length)} kopnenih). Svaki kopneni heks pripada opštini u kojoj mu je središte. Brojke opština (zarade, firme, fakultet, noćenja) raspoređene su po heksovima prema broju stanovnika iz Kontur mreže, a noćenja prema smještajnim objektima iz OpenStreetMap-a. Zbir po opštini uvijek je jednak zvaničnom podatku.</p>
  <p><b>Zlato nije BDP.</b> MONSTAT ne objavljuje BDP po opštinama. Zlato je masa neto zarada: zaposleni 2024 x prosječna neto plata 2025 x 12.</p>
  <p><b>Teren</b> spaja dva sloja. Pokrivač tla je ESA WorldCover 2021 (satelitski, 10 m): za svaki heks uzeta je 61 tačka i izračunat udio šume, livada, makije, polja i naselja. Broj stabala na heksu prati udio šume. Brda, planine i snijeg dolaze iz reljefa (Terrarium visine, oko 110 m), a sjenčenje je svjetlo sa sjeverozapada. Rijeke su iz OpenStreetMap-a, okolne zemlje i more iz istog reljefa. Hrana je pravilo igre po terenu, ne podatak o poljoprivredi.</p>
  <p><b>Distrikti i čuda</b> se dodjeljuju po objavljenim pravilima, vidljivim u pogledu grada. Čuda su 20 objekata u CG sa najviše jezičkih verzija na Wikipediji (Wikidata, novembar 2026), bez rijeka, jezika i regiona.</p>
  <p><b>Bogatstvo</b> je CG Civ procjena: prosjek standardizovanih vrijednosti mase zarada po stanovniku, firmi na 1.000 stanovnika, udjela sezonskih stanova i udjela sa fakultetom. Plata 2026 je MONSTAT prosjek januar-septembar 2026 (Mjesečni statistički pregled 10/2026).</p>
  <p><b>Nacija, jezik i vjera</b> su udjeli iz Popisa 2023 prema slobodnom izjašnjavanju (MONSTAT, saopštenje 135/2024). Mapa ih prikazuje bez tumačenja.</p>
  <p><b>Najnoviji podaci (26.11.2026):</b> turizam ukupno 2025 po opštinama (MONSTAT saopštenje 27/2026), hoteli avgust i septembar 2026 prema 2025 (MONSTAT mjesečna saopštenja, kolektivni smještaj; Andrijevica, Gusinje, Petnjica, Plav, Plužine, Šavnik, Tuzi i Zeta se ne objavljuju zbog povjerljivosti), registrovani nezaposleni i stopa ZZZCG na 30.6.2026 (polugodišnji izvještaj), prirodni priraštaj 2025 (MONSTAT saopštenje 59/2026).</p>
  <p><b>Kontrola zbirova:</b> stanovnici ${fmt(nat.pop2023)}, zaposleni ${fmt(nat.employed2024)}, nezaposleni ${fmt(nat.unemployed_jun2026)}, firme ${fmt(nat.firms2025)}, studenti ${fmt(nat.students2024)} - jednako zvaničnim ukupnim brojevima.</p>
  <h3 style="font-size:20px;margin-top:16px">Zvanični izvori po polju</h3>
  <ul>${Object.entries(S).map(([src,f])=>`<li>${esc(src)} <span class="muted">(${f.map(esc).join(', ')})</span></li>`).join('')}</ul>
  <h3 style="font-size:20px;margin-top:16px">Prostorni i otvoreni izvori</h3>
  <p><b>Boka i granica.</b> Obala i Boka crtaju se preko heksova iz finog reljefa (Terrarium z12, oko 30 m, raster 50 m), pa se vide zalivi, Verige i Luštica. Kopnena državna granica je precizna linija iz Kontur granica (OSM). Prevlaka je označena kao zona čije razgraničenje nije završeno: po Privremenom protokolu iz 2002. kopno je pod Hrvatskom, a Crna Gora pitanje granice na kopnu i moru smatra otvorenim.</p>
  <p><b>Lovćen</b> je istaknut kao mitsko mjesto: Njegoševa kapela iz 1845, na čijem je mjestu od 1974. mauzolej.</p>
  <p><b>Sveta mjesta</b> su vjerski i memorijalni objekti iz Wikidata sa koordinatama u Crnoj Gori (${V.holy.length}), rangirani po broju jezičkih verzija na Wikipediji. Zlatne značke su sveta čuda: Manastir Ostrog, Cetinjski manastir, Njegošev mauzolej na Lovćenu (na mjestu Njegoševe kapele iz 1845, srušene 1972) i najpoznatiji hram svake vjere. Sve vjere imaju istu boju znački.</p>
  <ul><li>Granice 25 opština: Kontur Boundaries ME 2023 (OSM, CC BY 4.0)</li><li>Naseljenost: Kontur Population ME 2023, H3 mreža (CC BY 4.0)</li><li>Reljef: Terrarium visinske pločice (AWS Open Data, Mapzen)</li><li>Pokrivač tla: ESA WorldCover 2021 v200, 10 m (CC BY 4.0)</li><li>Rijeke: © OpenStreetMap saradnici (ODbL)</li><li>Skadarsko jezero: Natural Earth (javno dobro)</li><li>Bogomolje, smještaj, baština: © OpenStreetMap saradnici (ODbL), novembar 2026</li><li>Elektrane, čuda i sveta mjesta: Wikidata (CC0)</li></ul>
  <p class="muted">Po uzoru na Karpathyjev USA Civ (karpathy.ai/usaciv). Napravio Schule d.o.o., Podgorica · <a href="https://schule.co.me">schule.co.me</a> · office@schule.co.me. Podaci zaključno sa 26.11.2026.</p>`;
}

/* ---------- tabs ---------- */
function showTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='p-'+t);if(t==='explorer')scatter()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)showTab(b.dataset.t)});
}
</script>
