<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CG Civ - Crna Gora na heksovima</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: strateška igra koja govori kao statistički godišnjak - mirno, tačno, sa izvorom ispod svake brojke.
   IDEA: atlas-ploča iz Civilizacije: more i heksovi, gradski barjaci, savjetnici.
   PICTURE: cijela Crna Gora na 1.850 heksova od ~8 km2, obojena izabranim sočivom.
   COLOUR and TYPE: duboko more #0b2233, bordo Schule #630D3D, zlato #d9a441 za akcenat; Caladea naslovi, Carlito tekst.
   LAYOUT: mapa lijevo preko cijele visine, ploča sa karticama desno; ispod 900px ploča ide ispod mape. */
:root{color-scheme:light dark;--sea:#0b2233;--bg:light-dark(#f4f1ea,#0e1a24);--panel:light-dark(#fffdf8,#142430);--ink:light-dark(#1c1a17,#e9e4d8);
--mute:light-dark(#6b645a,#9fa9b0);--line:light-dark(#ddd5c6,#26394a);--bordo:#630D3D;--bordo2:light-dark(#630D3D,#c2577f);--gold:#d9a441}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Carlito,Calibri,'Segoe UI',sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Caladea,Cambria,Georgia,serif;margin:0;line-height:1.1;text-wrap:balance}
button,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px;background:var(--bordo);color:#fff}
header h1{font-size:26px}header .sub{font-size:14px;opacity:.85}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:14px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 56px);min-height:520px}
#mapwrap{position:relative;background:var(--sea);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(11,34,51,.88);color:#e9e4d8;border-radius:10px;padding:10px 12px;font-size:13px;max-width:min(320px,70%)}
#legend .bar{height:10px;border-radius:5px;margin:6px 0 2px}
#legend .ends{display:flex;justify-content:space-between;gap:10px}
#tip{position:absolute;pointer-events:none;background:#fffdf8;color:#1c1a17;border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;max-width:260px;z-index:3}
#tip b{font-family:Caladea,serif;font-size:15px}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:#630D3D;color:#fff;font-size:20px;cursor:pointer}
aside{background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;min-height:44px;border:0;background:none;padding:8px 10px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{border-bottom-color:var(--bordo2);font-weight:700}
.tabs button:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pane{padding:14px 16px;overflow-y:auto;flex:1}
.pane[hidden]{display:none}
.lgrp{font-size:13px;color:var(--mute);margin:14px 0 6px}
.lens{display:block;width:100%;text-align:start;border:1px solid var(--line);background:none;border-radius:8px;padding:8px 10px;margin:4px 0;cursor:pointer;min-height:40px}
.lens[aria-pressed=true]{border-color:var(--bordo2);background:light-dark(#f6e9ef,#2a1a24)}
.lens small{display:block;color:var(--mute);font-size:13px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px}
.card h3{font-size:19px;margin-bottom:4px}
.card .find{margin:4px 0 8px}
.card ol{margin:0;padding-inline-start:20px;font-size:15px}
.card .go{border:0;background:var(--bordo);color:#fff;border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer;margin-top:8px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}
label.sel{display:block;font-size:13px;color:var(--mute);margin:6px 0 2px}
select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:6px 8px;font-size:16px}
.fig{position:relative;height:300px;margin:10px 0}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
th:first-child,td:first-child{text-align:start;position:sticky;left:0;background:var(--panel)}
th{cursor:pointer;font-weight:700;font-size:13px;vertical-align:bottom}
tr.hl td{background:light-dark(#f6e9ef,#2a1a24)}
tbody tr{cursor:pointer}
#city{position:fixed;inset:0;background:rgba(5,15,22,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#city.open{display:flex}
#city .box{background:var(--panel);color:var(--ink);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#city .top{background:var(--bordo);color:#fff;padding:16px 20px;display:flex;gap:12px;align-items:flex-start}
#city .top h2{font-size:36px}
#city .x{margin-inline-start:auto;width:44px;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
#city .body{padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.yields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.y{border-radius:10px;padding:8px;color:#fff}
.y b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.y span{font-size:13px}
.dist{display:flex;flex-wrap:wrap;gap:6px}
.dist span{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px}
.dist span i{display:block;font-style:normal;color:var(--mute);font-size:13px}
.kv td{text-align:end}.kv td:first-child{text-align:start;white-space:normal}
.popbars{display:flex;gap:8px;align-items:flex-end;height:80px}
.popbars div{flex:1;background:var(--bordo2);border-radius:4px 4px 0 0;position:relative}
.popbars div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px}
.popbars+div{display:flex;gap:8px}.popbars+div span{flex:1;text-align:center;font-size:12px;color:var(--mute)}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);height:auto}#mapwrap{height:68vh}aside{border-inline-start:0}.pills{margin-inline-start:0}}
@media(max-width:600px){#city .body{grid-template-columns:minmax(0,1fr)}header h1{font-size:22px}#city .top h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>CG Civ</h1><div class="sub">Crna Gora na heksovima: 25 opština, stvarni podaci, jezik Civilizacije · <a href="https://schule.co.me" style="color:#fff">schule.co.me</a></div></div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map" aria-label="Heks mapa Crne Gore"></canvas>
    <div class="zoom"><button id="zin" aria-label="Uvećaj">+</button><button id="zout" aria-label="Umanji">-</button><button id="zfit" aria-label="Cijela mapa">◎</button></div>
    <div id="legend"></div><div id="tip"></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-t="lenses" aria-selected="true">Sočiva</button>
      <button role="tab" data-t="advisors" aria-selected="false">Savjetnici</button>
      <button role="tab" data-t="explorer" aria-selected="false">Istraživač</button>
      <button role="tab" data-t="sources" aria-selected="false">Izvori</button>
    </div>
    <div class="pane" id="p-lenses"><p class="muted">Klik na grad otvara pogled grada. Klik na heks pokazuje njegove brojke. Prevuci i zumiraj.</p><div id="lensList"></div><div id="hexInfo"></div></div>
    <div class="pane" id="p-advisors" hidden></div>
    <div class="pane" id="p-explorer" hidden>
      <label class="sel" for="ex">Osa X</label><select id="ex"></select>
      <label class="sel" for="ey">Osa Y</label><select id="ey"></select>
      <div class="fig"><svg id="scatter" role="img" aria-label="Dijagram rasipanja opština"></svg></div>
      <p class="muted" id="corr"></p>
      <div class="scroll"><table id="extab"></table></div>
    </div>
    <div class="pane" id="p-sources" hidden></div>
  </aside>
</main>
<div id="city" role="dialog" aria-modal="true" aria-labelledby="cityName"><div class="box" id="cityBox"></div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>v==null||isNaN(v)?'-':Number(v).toLocaleString('sr-Latn-ME',{maximumFractionDigits:d,minimumFractionDigits:0});
const SQ3=Math.sqrt(3);
const TERR={plains:['#c8bf78','Ravnica'],grassland:['#93b35e','Livade i polja'],hills:['#6e8c4b','Brda'],mountain:['#8b8272','Planine'],peak:['#ece9e2','Vrhovi iznad 2.100 m'],lake:['#3d7ea8','Jezero'],sea:['#1c4f74','More']};
const YC={food:'#4f9a3c',prod:'#c8692a',gold:'#c9952c',science:'#3f7fc9',culture:'#8a4bb0',faith:'#e0d7c3'};
let touched=false,D,hexes,byKey={},cityByKey={},T={},nat,s=10,tx=0,ty=0,lens='terrain',sel=null,dpr=1;
const cv=$('#map'),cx=cv.getContext('2d');

fetch('cgciv.json').then(r=>r.json()).then(d=>{D=d;init()}).catch(e=>{$('#legend').textContent='Podaci nijesu učitani: '+e.message});

function init(){
  hexes=D.hexes;nat=D.meta.nat;
  for(const h of hexes){h.px=SQ3*(h.q+h.r/2);h.py=-1.5*h.r;byKey[h.q+','+h.r]=h}
  for(const c of D.cities)cityByKey[c.q+','+c.r]=c;
  for(const r of D.table)T[r['Opština']]=r;
  $('#pills').innerHTML=[['Stanovnici',fmt(nat.pop2023)],['Zlato',fmt(nat.wagebill_meur)+' mil. €'],['Firme',fmt(nat.firms2025)],['Noćenja',fmt(nat.nights2024/1e6,1)+' mil.'],['Heksova',fmt(hexes.length)]]
    .map(([a,b])=>`<span class="pill">${a} <b>${b}</b></span>`).join('');
  buildLenses();buildAdvisors();buildExplorer();buildSources();resize();fit();
}

/* ---------- lenses ---------- */
const HL={
  terrain:{g:'Mapa',l:'Teren',d:'Izveden iz reljefa (prosjek i raspon visina u heksu). Nije sloj pokrivača tla.'},
  elev:{g:'Mapa',l:'Reljef',d:'Prosječna nadmorska visina heksa, m',v:h=>h.terrain==='sea'?null:h.emean,ramp:['#2f6b3a','#d8c48a','#8b5a3c','#f2f0ea']},
  pop:{g:'Prinosi heksa',l:'Stanovnici',d:'Popis 2023 raspoređen po Kontur mreži naseljenosti',v:h=>h.pop,log:1},
  gold:{g:'Prinosi heksa',l:'Zlato',d:'1 zlato = 1 mil. € godišnje mase neto zarada (zaposleni x plata x 12), raspoređeno po stanovnicima',v:h=>h.gold,log:1,ramp:['#3a2f12','#c9952c','#ffe7a3']},
  prod:{g:'Prinosi heksa',l:'Proizvodnja',d:'Teren + aktivne firme 2025 (1 po 60) + elektrane (1 po 20 MW)',v:h=>h.prod,ramp:['#2a1a10','#c8692a','#ffd2a8']},
  science:{g:'Prinosi heksa',l:'Nauka',d:'Stanovnici sa fakultetom (Popis 2023), 1 po 300',v:h=>h.science,log:1,ramp:['#0f2238','#3f7fc9','#cfe4ff']},
  culture:{g:'Prinosi heksa',l:'Kultura i turizam',d:'Objekti baštine u OSM + noćenja 2024 (1 po 25.000)',v:h=>h.culture,log:1,ramp:['#1f1029','#8a4bb0','#ecd3ff']},
  faith:{g:'Prinosi heksa',l:'Vjera',d:'Broj bogomolja u OpenStreetMap, bez podjele po vjeri',v:h=>h.faith,log:1,ramp:['#2a2620','#bfb39a','#fffaf0']},
  food:{g:'Prinosi heksa',l:'Hrana',d:'Po terenu, +1 uz more i uz jezero (pravilo igre, ne podatak o proizvodnji)',v:h=>h.food,ramp:['#1f2a14','#4f9a3c','#d6f5b8']},
  nights:{g:'Prinosi heksa',l:'Noćenja',d:'Noćenja 2024 opštine raspoređena po smještajnim objektima iz OSM',v:h=>h.nights,log:1,ramp:['#10202c','#2e9aa8','#c9fbff']},
};
const MUNI_LENS=['Neto plata 2025 €','Nezaposlenost % (reg.)','Firme na 1.000 st.','Rast firmi 2024-25 %','Fakultet % (15+)','Programiranje %','Noćenja po stanovniku','Sezonski stanovi %','Promjena 1991-2023 %','Prirodni priraštaj ‰','65+ %','Ljekari na 10.000 st.','MOP korisnici na 1.000 st.','Gustina st/km2'];
const DIVERGE=new Set(['Promjena 1991-2023 %','Prirodni priraštaj ‰','Rast firmi 2024-25 %']);
function buildLenses(){
  let g='',out='';
  const all=[...Object.entries(HL).map(([k,o])=>[k,o.g,o.l,o.d]),...MUNI_LENS.map(c=>['m:'+c,'Po opštinama',c,'Vrijednost opštine, sve heksove boji isto'])];
  for(const [k,gr,l,d] of all){if(gr!==g){out+=`<div class="lgrp">${esc(gr)}</div>`;g=gr}out+=`<button class="lens" data-k="${esc(k)}" aria-pressed="${k===lens}">${esc(l)}<small>${esc(d)}</small></button>`}
  $('#lensList').innerHTML=out;
  $('#lensList').addEventListener('click',e=>{const b=e.target.closest('.lens');if(b)setLens(b.dataset.k)});
}
function setLens(k){lens=k;document.querySelectorAll('.lens').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));draw()}
function hex2rgb(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
function ramp(cols,t){t=Math.max(0,Math.min(1,t));const n=cols.length-1,i=Math.min(n-1,Math.floor(t*n)),f=t*n-i,a=hex2rgb(cols[i]),b=hex2rgb(cols[i+1]);return`rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*f)).join(',')})`}
let scaleCache={};
function lensScale(){
  if(scaleCache.k===lens)return scaleCache;
  let vals,get,cols,log=0,div=false;
  if(lens.startsWith('m:')){const c=lens.slice(2);get=h=>h.muni?T[h.muni][c]:null;vals=D.table.map(r=>r[c]).filter(v=>v!=null);div=DIVERGE.has(c);cols=div?['#2f6ea6','#f2efe8','#a3243f']:['#f3ead2','#c9786f','#630D3D','#2a0418']}
  else{const o=HL[lens];get=o.v;log=o.log;cols=o.ramp||['#16303f','#9c4a6c','#f7d9e4'];vals=hexes.map(get).filter(v=>v!=null)}
  const tr=v=>log?Math.log10(1+v):v;let lo=Math.min(...vals.map(tr)),hi=Math.max(...vals.map(tr));
  if(div){const m=Math.max(Math.abs(lo),Math.abs(hi));lo=-m;hi=m}
  return scaleCache={k:lens,get,cols,lo,hi,tr,log,raw:[Math.min(...vals),Math.max(...vals)]};
}
function colorOf(h){
  if(lens==='terrain'||h.terrain==='sea'||h.terrain==='lake'&&lens!=='elev'){
    const base=TERR[h.terrain][0];if(h.terrain==='sea'||h.terrain==='lake')return base;
    const [r,g,b]=hex2rgb(base),k=1-Math.min(.25,(h.emean||0)/9000);return`rgb(${r*k|0},${g*k|0},${b*k|0})`}
  const S=lensScale(),v=S.get(h);if(v==null)return'#3a3f44';
  return ramp(S.cols,(S.tr(v)-S.lo)/((S.hi-S.lo)||1));
}
function legend(){
  if(lens==='terrain'){$('#legend').innerHTML='<b>Teren</b><br>'+Object.values(TERR).map(([c,l])=>`<span style="display:inline-block;width:10px;height:10px;background:${c};border-radius:2px"></span> ${l}`).join('<br>')+'<br><span class="muted" style="color:#9fb1bd">Gradovi, zvijezde = čuda, munje = elektrane</span>';return}
  const S=lensScale(),name=lens.startsWith('m:')?lens.slice(2):HL[lens].l;
  const g=`linear-gradient(90deg,${[0,.25,.5,.75,1].map(t=>ramp(S.cols,t)).join(',')})`;
  const lo=lens.startsWith('m:')&&DIVERGE.has(lens.slice(2))?S.lo:S.raw[0],hi=lens.startsWith('m:')&&DIVERGE.has(lens.slice(2))?S.hi:S.raw[1];
  $('#legend').innerHTML=`<b>${esc(name)}</b>${S.log?' <span style="color:#9fb1bd">(log skala)</span>':''}<div class="bar" style="background:${g}"></div><div class="ends"><span class="num">${fmt(lo,1)}</span><span class="num">${fmt(hi,1)}</span></div>`;
}

/* ---------- map drawing ---------- */
function resize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;if(!touched&&hexes)fit();else draw()}
function fit(){
  const r=cv.getBoundingClientRect();let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const h of hexes){x0=Math.min(x0,h.px);x1=Math.max(x1,h.px);y0=Math.min(y0,h.py);y1=Math.max(y1,h.py)}
  s=Math.min(r.width/(x1-x0+3),r.height/(y1-y0+3));tx=r.width/2-s*(x0+x1)/2;ty=r.height/2-s*(y0+y1)/2;draw();
}
const VX=[0,1,2,3,4,5].map(i=>{const a=Math.PI/180*(60*i-90);return[Math.cos(a),Math.sin(a)]});
const NB=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
function draw(){
  if(!hexes)return;const W=cv.width/dpr,H=cv.height/dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#0b2233';cx.fillRect(0,0,W,H);
  const R=s*1.0;
  for(const h of hexes){
    const x=h.px*s+tx,y=h.py*s+ty;if(x<-R||y<-R||x>W+R||y>H+R)continue;
    cx.beginPath();VX.forEach(([a,b],i)=>i?cx.lineTo(x+a*R*1.01,y+b*R*1.01):cx.moveTo(x+a*R*1.01,y+b*R*1.01));cx.closePath();
    cx.fillStyle=colorOf(h);cx.fill();
  }
  // municipal and coast borders
  cx.lineCap='round';
  for(const h of hexes){
    if(!h.muni)continue;const x=h.px*s+tx,y=h.py*s+ty;if(x<-R||y<-R||x>W+R||y>H+R)continue;
    for(const [a,b] of NB){const n=byKey[(h.q+a)+','+(h.r+b)];if(n&&n.muni===h.muni)continue;
      const nx=SQ3*(h.q+a+(h.r+b)/2)*s+tx,ny=-1.5*(h.r+b)*s+ty,mx=(x+nx)/2,my=(y+ny)/2,dx=nx-x,dy=ny-y,L=Math.hypot(dx,dy),px=-dy/L*R/2,py=dx/L*R/2;
      const outer=!n||!n.muni;cx.strokeStyle=outer?'rgba(255,255,255,.75)':'rgba(20,20,20,.55)';cx.lineWidth=outer?Math.max(1.2,s*.14):Math.max(.8,s*.09);
      if(sel&&h.muni===sel&&(!n||n.muni!==sel)){cx.strokeStyle='#ffd166';cx.lineWidth=Math.max(2.5,s*.3)}
      cx.beginPath();cx.moveTo(mx+px,my+py);cx.lineTo(mx-px,my-py);cx.stroke()}
  }
  // yield pips when zoomed in
  if(s>16&&(lens==='terrain'))for(const h of hexes){if(!h.muni)continue;const x=h.px*s+tx,y=h.py*s+ty;if(x<0||y<0||x>W||y>H)continue;
    const p=[['food',h.food],['prod',Math.min(4,h.prod)],['gold',Math.min(4,Math.round(Math.log2(1+h.gold)))]];let k=0;
    for(const [t,n] of p)for(let i=0;i<n;i++){cx.fillStyle=YC[t];cx.beginPath();cx.arc(x-s*.45+(k%5)*s*.22,y+s*.28+Math.floor(k/5)*s*.22,s*.08,0,7);cx.fill();k++}}
  // power plants

  <p>Crna Gora je podijeljena na ${fmt(hexes.length)} heksova od oko 8 km² (${fmt(hexes.filter(h=>h.muni).length)} kopnenih). Svaki kopneni heks pripada opštini u kojoj mu je središte. Brojke opština (zarade, firme, fakultet, noćenja) raspoređene su po heksovima prema broju stanovnika iz Kontur mreže, a noćenja prema smještajnim objektima iz OpenStreetMap-a. Zbir po opštini uvijek je jednak zvaničnom podatku.</p>
  <p><b>Zlato nije BDP.</b> MONSTAT ne objavljuje BDP po opštinama. Zlato je masa neto zarada: zaposleni 2024 x prosječna neto plata 2025 x 12.</p>
  <p><b>Teren je izveden iz reljefa</b> (Terrarium visine, oko 110 m), ne iz sloja pokrivača tla. Šume se zato ne vide. Hrana je pravilo igre po terenu, ne podatak o poljoprivredi.</p>
  <p><b>Distrikti i čuda</b> se dodjeljuju po objavljenim pravilima, vidljivim u pogledu grada. Čuda su 20 objekata u CG sa najviše jezičkih verzija na Wikipediji (Wikidata, novembar 2026), bez rijeka, jezika i regiona.</p>
  <p><b>Kontrola zbirova:</b> stanovnici ${fmt(nat.pop2023)}, zaposleni ${fmt(nat.employed2024)}, nezaposleni ${fmt(nat.unemployed_jan2026)}, firme ${fmt(nat.firms2025)}, studenti ${fmt(nat.students2024)} - jednako zvaničnim ukupnim brojevima.</p>
  <h3 style="font-size:20px;margin-top:16px">Zvanični izvori po polju</h3>
  <ul>${Object.entries(S).map(([src,f])=>`<li>${esc(src)} <span class="muted">(${f.map(esc).join(', ')})</span></li>`).join('')}</ul>
  <h3 style="font-size:20px;margin-top:16px">Prostorni i otvoreni izvori</h3>
  <ul><li>Granice 25 opština: Kontur Boundaries ME 2023 (OSM, CC BY 4.0)</li><li>Naseljenost: Kontur Population ME 2023, H3 mreža (CC BY 4.0)</li><li>Reljef: Terrarium visinske pločice (AWS Open Data, Mapzen)</li><li>Skadarsko jezero: Natural Earth (javno dobro)</li><li>Bogomolje, smještaj, baština: © OpenStreetMap saradnici (ODbL), novembar 2026</li><li>Elektrane i čuda: Wikidata (CC0)</li></ul>
  <p class="muted">Po uzoru na Karpathyjev USA Civ (karpathy.ai/usaciv). Napravio Schule d.o.o., Podgorica · <a href="https://schule.co.me">schule.co.me</a> · office@schule.co.me. Podaci zaključno sa 26.11.2026.</p>`;
}

/* ---------- tabs ---------- */
function showTab(t){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.hidden=p.id!=='p-'+t);if(t==='explorer')scatter()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)showTab(b.dataset.t)});
}
</script>
